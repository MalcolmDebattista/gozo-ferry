[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gozo_ferry"
version = "0.4.0"
description = "Predicts Gozo Channel ferry cancellations from daily wind speed"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.15",
    "pandera>=0.30",
    "hypothesis>=6.100",
]

[project.scripts]
gozo-train = "gozo_ferry.train:main"
gozo-validate = "gozo_ferry.validate:main"
gozo-gate = "gozo_ferry.evaluate:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set, so a ruff upgrade cannot change what the pipeline checks.
select = ["E4", "E7", "E9", "F"]
